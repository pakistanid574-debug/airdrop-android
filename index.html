<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirDrop Android - Cross-Platform P2P File Transfer</title>
    <!-- PeerJS WebRTC Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <!-- Card Container -->
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
        
        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/30 text-2xl">
            📡
        </div>

        <h1 class="text-2xl font-bold mb-1 text-white">AirDrop Android</h1>
        <p class="text-xs text-slate-400 mb-6">Local P2P File Sharing for Android, PC & iOS</p>

        <!-- Your Device ID -->
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-5 font-mono text-xs flex justify-between items-center">
            <span class="text-slate-500">Your Device ID:</span> 
            <span id="my-id" class="text-emerald-400 font-bold select-all">Connecting...</span>
        </div>

        <!-- Receiver Input & Actions -->
        <div class="space-y-3">
            <input type="text" id="receiver-id" placeholder="Enter Receiver Device ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono">
            
            <input type="file" id="file-input" class="hidden" onchange="sendFile()">
            
            <button onclick="document.getElementById('file-input').click()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium py-3 rounded-xl text-xs transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                📂 Select & Send File
            </button>
        </div>

        <!-- Transfer Status Log -->
        <div id="status" class="mt-6 text-xs text-slate-400 min-h-[20px] bg-slate-950/50 p-2 rounded-lg border border-slate-800/50">
            Ready for local peer transfer.
        </div>
    </div>

    <!-- WebRTC JavaScript Logic -->
    <script>
        const peer = new Peer();
        let conn = null;

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // Incoming Connection Event
        peer.on('connection', (connection) => {
            conn = connection;
            document.getElementById('status').innerText = '🟢 Connected to remote peer!';
            
            conn.on('data', (data) => {
                document.getElementById('status').innerText = `📥 Receiving: ${data.name}...`;
                
                const blob = new Blob([data.file]);
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = data.name;
                link.click();
                
                document.getElementById('status').innerText = '✅ File Received Successfully!';
            });
        });

        // Send File Function
        function sendFile() {
            const receiverId = document.getElementById('receiver-id').value.trim();
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];

            if (!receiverId || !file) {
                alert('Please enter Receiver Device ID and select a file!');
                return;
            }

            document.getElementById('status').innerText = '🚀 Connecting & Transferring...';
            conn = peer.connect(receiverId);

            conn.on('open', () => {
                conn.send({
                    file: file,
                    name: file.name,
                    size: file.size
                });
                document.getElementById('status').innerText = '✅ File Sent Successfully!';
            });
        }
    </script>
</body>
</html>
