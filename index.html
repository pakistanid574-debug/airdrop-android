<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirDrop Android - Fast P2P Transfer</title>
    <!-- PeerJS WebRTC Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans relative">

    <!-- Incoming Transfer Request Modal -->
    <div id="request-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="text-3xl mb-2">📥</div>
            <h2 class="text-lg font-bold text-white mb-1">Incoming File Request</h2>
            <p id="incoming-file-info" class="text-xs text-slate-400 mb-6">Someone wants to send you a file.</p>
            <div class="flex gap-3">
                <button onclick="rejectFile()" class="flex-1 bg-rose-600/20 border border-rose-500/30 hover:bg-rose-600 text-rose-300 hover:text-white py-2.5 rounded-xl text-xs font-medium transition-all">Reject</button>
                <button onclick="acceptFile()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-medium transition-all shadow-lg shadow-emerald-600/20">Accept</button>
            </div>
        </div>
    </div>

    <!-- Main Card Container -->
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
        
        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/30 text-2xl">
            📡
        </div>

        <h1 class="text-2xl font-bold mb-1 text-white">AirDrop Android</h1>
        <p class="text-xs text-slate-400 mb-6">Instant Request-Based P2P Sharing</p>

        <!-- Your Device ID -->
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-4 font-mono text-xs flex justify-between items-center">
            <span class="text-slate-500">My ID:</span> 
            <span id="my-id" class="text-emerald-400 font-bold select-all truncate max-w-[180px]">Generating Fast...</span>
            <button onclick="copyId()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] transition-colors">Copy</button>
        </div>

        <!-- Receiver Input & Actions -->
        <div class="space-y-3">
            <input type="text" id="receiver-id" placeholder="Enter Receiver Device ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono">
            
            <input type="file" id="file-input" class="hidden" onchange="prepareAndSendRequest()">
            
            <button onclick="triggerFileSelect()" id="send-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium py-3 rounded-xl text-xs transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                📂 Select & Send File
            </button>
        </div>

        <!-- Transfer Status Log -->
        <div id="status" class="mt-6 text-xs text-slate-400 min-h-[30px] bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/50 flex items-center justify-center">
            Ready for instant transfer.
        </div>
    </div>

    <!-- Fixed JavaScript Logic -->
    <script>
        let peer = null;
        let conn = null;
        let myPeerId = '';
        let pendingFile = null;

        function initPeer() {
            const fastId = 'drop-' + Math.random().toString(36).substring(2, 8);
            peer = new Peer(fastId);

            peer.on('open', (id) => {
                myPeerId = id;
                document.getElementById('my-id').innerText = id;
                updateStatus('🟢 Ready for connection', 'text-emerald-400');
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    initPeer();
                } else {
                    console.error(err);
                    updateStatus('⚠️ Reconnecting...', 'text-rose-400');
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionHandlers();
            });
        }

        function copyId() {
            if (!myPeerId) return;
            navigator.clipboard.writeText(myPeerId);
            alert('Device ID Copied to Clipboard!');
        }

        function triggerFileSelect() {
            const receiverId = document.getElementById('receiver-id').value.trim();
            if (!receiverId) {
                alert('Please enter Receiver Device ID first!');
                return;
            }
            if (receiverId === myPeerId) {
                alert('You cannot send a file to yourself!');
                return;
            }

            if (!conn || conn.peer !== receiverId) {
                updateStatus('Connecting to receiver...', 'text-amber-400');
                conn = peer.connect(receiverId);
                
                setupConnectionHandlers();
                
                conn.on('open', () => {
                    updateStatus('🟢 Connected! Select a file.', 'text-emerald-400');
                    document.getElementById('file-input').click();
                });

                conn.on('error', () => {
                    updateStatus('❌ Failed to connect to receiver ID.', 'text-rose-400');
                });
            } else {
                document.getElementById('file-input').click();
            }
        }

        function prepareAndSendRequest() {
            const fileInput = document.getElementById('file-input');
            pendingFile = fileInput.files[0];
            if (!pendingFile || !conn) return;

            updateStatus('📤 Sending file request...', 'text-amber-400');
            conn.send({
                type: 'request-file',
                name: pendingFile.name,
                size: pendingFile.size,
                fileType: pendingFile.type
            });
        }

        function setupConnectionHandlers() {
            if (!conn) return;

            conn.on('data', async (data) => {
                if (data.type === 'request-file') {
                    document.getElementById('incoming-file-info').innerText = 
                        `File: ${data.name} (${formatBytes(data.size)})`;
                    document.getElementById('request-modal').classList.remove('hidden');
                    updateStatus('📥 Incoming transfer request...', 'text-amber-400');

                } else if (data.type === 'response-accept') {
                    updateStatus('🚀 Request accepted! Converting & sending...', 'text-indigo-400');
                    
                    // Convert file to ArrayBuffer to ensure 100% reliable transfer over WebRTC
                    const arrayBuffer = await pendingFile.arrayBuffer();
                    
                    conn.send({
                        type: 'file-transfer',
                        fileBuffer: arrayBuffer,
                        name: pendingFile.name,
                        fileType: pendingFile.type
                    });
                    
                    updateStatus('✅ File Sent Successfully!', 'text-emerald-400');
                    document.getElementById('file-input').value = '';

                } else if (data.type === 'response-reject') {
                    updateStatus('❌ Receiver rejected the file request.', 'text-rose-400');
                    document.getElementById('file-input').value = '';

                } else if (data.type === 'file-transfer') {
                    updateStatus(`📥 Receiving ${data.name}...`, 'text-indigo-400');
                    
                    // Rebuild file from ArrayBuffer
                    const blob = new Blob([data.fileBuffer], { type: data.fileType });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = data.name;
                    link.click();
                    
                    updateStatus('✅ File Received Successfully!', 'text-emerald-400');
                }
            });
        }

        function acceptFile() {
            document.getElementById('request-modal').classList.add('hidden');
            updateStatus('🟢 Request accepted. Waiting for file...', 'text-emerald-400');
            conn.send({ type: 'response-accept' });
        }

        function rejectFile() {
            document.getElementById('request-modal').classList.add('hidden');
            updateStatus('❌ You rejected the file request.', 'text-rose-400');
            conn.send({ type: 'response-reject' });
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        initPeer();
    </script>
</body>
</html>
